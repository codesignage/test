{% extends 'base.html' %}
{% block content %}
<h3>New Sale</h3>
<form method="post" id="sale-form">
  <div class="table-responsive">
    <table class="table table-bordered align-middle">
      <thead>
        <tr>
          <th>Product</th>
          <th>Unit Price</th>
          <th style="width: 140px;">Quantity</th>
          <th>Line Total</th>
        </tr>
      </thead>
      <tbody>
        {% for p in products %}
        <tr>
          <td>
            <input type="hidden" name="product_id" value="{{ p.id }}">
            {{ p.name }}
          </td>
          <td class="unit-price" data-price="{{ '%.2f'|format(p.price|float) }}">{{ '%.2f'|format(p.price|float) }}</td>
          <td>
            <input type="number" min="0" value="0" name="quantity" class="form-control quantity-input">
          </td>
          <td class="line-total">0.00</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label">Total</label>
      <input type="text" class="form-control" id="total" name="total" value="0.00" readonly>
    </div>
    <div class="col-md-3">
      <label class="form-label">Paid Amount</label>
      <input type="number" step="0.01" min="0" class="form-control" id="paid_amount" name="paid_amount" value="0.00">
    </div>
    <div class="col-md-3">
      <label class="form-label">Change</label>
      <input type="text" class="form-control" id="change" name="change" value="0.00" readonly>
    </div>
  </div>

  <div class="mt-3">
    <button class="btn btn-success" type="submit">Save Sale</button>
  </div>
</form>

<script>
(function(){
  const qtyInputs = document.querySelectorAll('.quantity-input');
  function recalc(){
    let total = 0;
    document.querySelectorAll('tbody tr').forEach(function(row){
      const price = parseFloat(row.querySelector('.unit-price').dataset.price);
      const qty = parseInt(row.querySelector('.quantity-input').value || '0');
      const line = (price * qty) || 0;
      row.querySelector('.line-total').innerText = line.toFixed(2);
      total += line;
    });
    document.getElementById('total').value = total.toFixed(2);
    const paid = parseFloat(document.getElementById('paid_amount').value || '0');
    const change = (paid - total) || 0;
    document.getElementById('change').value = change.toFixed(2);
  }
  qtyInputs.forEach(function(inp){ inp.addEventListener('input', recalc); });
  document.getElementById('paid_amount').addEventListener('input', recalc);
})();
</script>
{% endblock %}
