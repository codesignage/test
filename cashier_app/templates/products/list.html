{% extends 'base.html' %}
{% block content %}
<h3>Products</h3>
<a class="btn btn-primary mb-3" href="{{ url_for('products.new_product') }}">New Product</a>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Created</th>
    </tr>
  </thead>
  <tbody>
    {% for p in products %}
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ '%.2f'|format(p.price|float) }}</td>
      <td>{{ p.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
