{% extends 'base.html' %}
{% block content %}
<h3>Users</h3>
<a class="btn btn-primary mb-3" href="{{ url_for('users.new_user') }}">New User</a>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Email</th>
      <th>Role</th>
      <th>Created</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.email }}</td>
      <td>{{ u.role }}</td>
      <td>{{ u.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
      <td><a class="btn btn-sm btn-outline-secondary" href="{{ url_for('users.edit_user', user_id=u.id) }}">Edit</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
